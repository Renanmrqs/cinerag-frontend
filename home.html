<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinerag Analytics</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="/index.html" class="logo">
                <img src="img/cinerag_logo.png" alt="CineRag" height="50">
            </a>
            <ul class="nav-list">
                <li><a href="/home.html">Home</a></li>
                <li><a href="/favorites.html">Favorites</a></li>
                <li><button id="logout">Logout</button></li>
            </ul>
        </nav>

    </header>


    <section class="container">
        <div id="tittle"><h1>Cinerag Analytics</h1></div>
        
        <div id="search-film">
            <label for="search">Search Film</label>
            <input type="search" name="search Film" id="search" required>
            <button id="search-btn">search</button>
        </div>
    </section>

    <section id="results">
    </section>

    <section id="sentiment-panel" hidden>
    </section>


    <button id="chat-btn">CineAI</button>

    <section id="chat" hidden>
        
        <div id="chat-msg"></div>
        
        <input id="text-user" type="text">
        
        <button id="send-btn-chat">Send</button>

        <button id="inside-chat-btn">X</button>
    
    </section>


    <script src="js/chat.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/app.js"></script>
    

</body>
</html>

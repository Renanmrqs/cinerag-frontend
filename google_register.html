    <title>Register Google</title>

<body>
    <section class="container">
        <div id="tittle"><h1>Cinerag Analytics</h1></div>
        <form id="register">
            <h1>Register Complete</h1>
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username" required>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password_register" required>
            </div>
            <input class="btn_register" type="submit" value="submit">
            <div id="res_register"></div>

        </form>

    </section>

<script src="js/auth_google.js"></script>
